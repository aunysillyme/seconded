name = "seconded-room"
main = "src/index.js"
compatibility_date = "2026-08-01"

# One room per Durable Object, addressed by name, so idFromName(CODE) is the
# whole room system. No database, no schema, no model at runtime.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
